:root {
  --night: #0e0c10;
  --stone-900: #1b1816;
  --stone-700: #2e2925;
  --stone-500: #4a423a;
  --bone: #ede3d0;
  --bone-dim: #a89b88;
  --amber: #f2b54a;
  --amber-deep: #c9782a;
  --ochre: #c8643a;
  --text: 'Strata Pixel', monospace;
  --display: 'Strata Stone', 'Strata Pixel', monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--bone); font-family: var(--text); font-size: 16px; line-height: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: none; font-smooth: never;
}
#game { position: relative; width: 360px; height: 640px; flex: none; overflow: hidden; border-radius: 10px; background: #000; touch-action: manipulation; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
.shadow { text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000, 1px 0 0 #000; }
.hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px 20px; display: grid; gap: 6px;
  background: linear-gradient(rgba(14,12,16,.75), rgba(14,12,16,0)); pointer-events: none; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/** A thin bed drapes the surface: the skin of the strata (the top particle of each column and the particles of

 *  the strata as a line of that moment — the outline of the old surface, folded by later piles and compaction.
 *  Sources: the player («Прослой», with a cooldown), every new epoch (a golden boundary), volcanic eruptions (a pale

function pileMix() {

  }
  for (; k < cells.length; k++) { const i = cells[k]; mat[i] = order[0].m; look[i] = (Math.random() * 256) | 0; prog[i] = 0; }

}

  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'buy' + (cur === 'stone' ? ' stone' : '');
  btn.textContent = locked ? 'закрыто' : (cur === 'stone' ? '◆ ' : '⟡ ') + fmt(price);
  btn.dataset.cost = price; btn.dataset.cur = cur;
  btn.disabled = !!locked;
  if (!locked) btn.addEventListener('click', (e) => { e.stopPropagation(); onBuy(); });
  r.appendChild(btn);
  return r;
}
function buildList() {
  const L = $('list'); L.innerHTML = '';
  const sec = (title) => { const s = document.createElement('div'); s.className = 'sec'; const h = document.createElement('h3'); h.textContent = title; s.appendChild(h); L.appendChild(s); return s; };
  const s0 = sec('Эпоха');
  const era = document.createElement('div'); era.className = 'era';
  const E = EPOCHS[S.epoch], NX = EPOCHS[S.epoch + 1];
  const eb = document.createElement('b'); eb.textContent = `${roman[S.epoch]} · ${E.name}`; era.appendChild(eb);
  era.appendChild(document.createElement('br')); era.appendChild(document.createTextNode(E.text));
  if (NX) { era.appendChild(document.createElement('br')); era.appendChild(document.createTextNode(`Дальше — ${NX.name}: ◆ ${fmt(NX.need)} камня всего.`)); }
  era.appendChild(document.createElement('br'));
  era.appendChild(document.createTextNode('Прослои: охра (кнопка «Прослой»), золотая граница каждой новой эпохи, светлый пепел от извержений. Они остаются в толще линиями и дорого стоят, когда уходят в глубину.'));
  s0.appendChild(era);
  // strength
  const s2 = sec('Сила');
  for (const id in UPS) {
    const U = UPS[id], l = S.lv[id], c = cost(U.base, U.g, l);
    s2.appendChild(upRow(null, `${U.name} · ур. ${l}`, U.desc(l), c, U.cur, () => {
      const have = U.cur === 'stone' ? S.stone : S.energy;
      if (have < c) return;
      if (U.cur === 'stone') S.stone -= c; else S.energy -= c;
      S.lv[id]++; buildList(); dirtyUI = true;
    }));
  }
  // materials of the pile
  const s1 = sec('Материалы кучки');
  const mix = pileMix(), tot = mix.reduce((a, q) => a + q.w, 0);
  const share = (m) => { const q = mix.find((z) => z.m === m); return q ? Math.round((q.w / tot) * 100) : 0; };
  const dustRow = document.createElement('div'); dustRow.className = 'up';
  dustRow.appendChild(swatch(MATS[MI.dust]));
  const dt = document.createElement('div'); dt.className = 't'; dt.innerHTML = '<b>Пыль</b>';
  const dts = document.createElement('span'); dts.textContent = `основа кучки · ${share(MI.dust)}%`; dt.appendChild(dts);
  dustRow.appendChild(dt); dustRow.appendChild(document.createElement('span')); s1.appendChild(dustRow);
  for (const id in MAT_UP) {
    const ep = EPOCHS.findIndex((e) => e.unlock.includes(id));
    const locked = ep > S.epoch;
    if (ep > S.epoch + 1) continue;
    const l = S.mlv[id] || 0, M = MATS[MI[id]], c = cost(MAT_UP[id].base, 1.45, l);
    const path = []; let k = M.toI; while (k >= 0) { path.push(MATS[k].name.toLowerCase()); k = MATS[k].toI; }
    const sub = locked ? `откроется в эпоху «${EPOCHS[ep].name}»` : `ур. ${l} · ${share(MI[id])}% кучки · → ${path.join(' → ')}`;
    s1.appendChild(upRow(swatch(M), M.name, sub, c, 'energy', () => { if (S.energy >= c) { S.energy -= c; S.mlv[id] = l + 1; buildList(); dirtyUI = true; } }, locked));
  }
  // collection
  const s3 = sec('Породы в толще');
  const g = document.createElement('div'); g.className = 'rocks';
  let any = false;
  for (const M of ROCKS) {
    const n = S.rocks[M.id] || 0; if (!n) continue; any = true;
    const r = document.createElement('div'); r.className = 'rock'; r.appendChild(swatch(M));
    const s = document.createElement('span'); s.textContent = M.name; r.appendChild(s);
    const b = document.createElement('b'); b.className = 'num'; b.textContent = fmt(n); r.appendChild(b);
    g.appendChild(r);
  }
  if (!any) { const p = document.createElement('div'); p.style.cssText = 'font-size:12px;color:var(--bone-dim)'; p.textContent = 'Пока пусто: породы появятся, когда толща поднимется до пунктирной линии и низ начнёт уплотняться.'; s3.appendChild(p); }
  else s3.appendChild(g);
  // test
  const s4 = sec('Для теста');
  const t = document.createElement('div'); t.className = 'test';
  const sp = document.createElement('button'); sp.type = 'button'; sp.id = 'spd'; sp.textContent = `Скорость ×${S.speed === 1 ? 5 : 1}`;
  if (S.speed > 1) sp.classList.add('on');
  sp.addEventListener('click', (e) => { e.stopPropagation(); S.speed = S.speed === 1 ? 5 : 1; buildList(); });
  const rs = document.createElement('button'); rs.type = 'button'; rs.id = 'rst'; rs.textContent = 'Начать заново';
  rs.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!rs.dataset.armed) { rs.dataset.armed = '1'; rs.textContent = 'Точно? Нажмите ещё раз'; rs.classList.add('on'); return; }
    S = newState(); resetWorld(); saveLocal(); buildList(); dirtyUI = true; $('hint').style.opacity = 1;
  });
  t.appendChild(sp); t.appendChild(rs); s4.appendChild(t);
  refreshButtons();
}
function refreshButtons() {
  let canBuy = false;
  for (const b of document.querySelectorAll('#list .buy')) {
    if (b.textContent === 'закрыто') continue;
    const have = b.dataset.cur === 'stone' ? S.stone : S.energy;
    b.disabled = have < +b.dataset.cost;
    if (!b.disabled) canBuy = true;
  }
  const btn = $('openUp');
  let dot = btn.querySelector('.dot');
  if (canBuy && !dot) { dot = document.createElement('span'); dot.className = 'dot'; btn.appendChild(dot); }
  if (!canBuy && dot) dot.remove();
}
function updateHUD() {
  const passive = rockCells * 0.01;
  $('energy').firstChild.nodeValue = '⟡ ' + fmt(S.energy);
  $('eps').textContent = passive >= 0.1 ? `+${passive < 10 ? passive.toFixed(1) : fmt(passive)}/с` : '';
  $('stone').textContent = '◆ ' + fmt(S.stone);
  const E = EPOCHS[S.epoch], nx = EPOCHS[S.epoch + 1];
  $('epName').textContent = `${roman[S.epoch]} · ${E.name}`;
  $('epBar').style.width = nx ? Math.min(100, ((S.stoneTotal - E.need) / (nx.need - E.need)) * 100) + '%' : '100%';
  $('epNext').textContent = nx ? `◆ ${fmt(S.stoneTotal)}/${fmt(nx.need)}` : '';
  const mix = pileMix(), tot = mix.reduce((a, q) => a + q.w, 0);
  const el = $('mix'); el.innerHTML = '';
  for (const q of mix) { const i = document.createElement('i'); i.style.width = (q.w / tot) * 100 + '%'; i.style.background = MATS[q.m].hex; i.title = MATS[q.m].name; el.appendChild(i); }
  $('pline').style.top = (lineY() / CH) * 100 + '%';
  $('veil').disabled = S.veilT > 0;
  $('veilCd').style.width = (S.veilT > 0 ? (S.veilT / VEIL_CD) * 100 : 0) + '%';
  $('pileN').textContent = `${pileSize(S.lv.pile)} частиц`;
  refreshButtons();
}

// ---------------- input ----------------
const sheet = $('sheet');
const openSheet = (on) => { sheet.classList.toggle('on', on); sheet.setAttribute('aria-hidden', on ? 'false' : 'true'); if (on) buildList(); };
$('openUp').addEventListener('click', (e) => { e.stopPropagation(); openSheet(true); });
$('closeUp').addEventListener('click', (e) => { e.stopPropagation(); openSheet(false); });
sheet.addEventListener('pointerdown', (e) => e.stopPropagation());
$('game').addEventListener('pointerdown', (e) => {
  if (sheet.classList.contains('on')) { openSheet(false); return; }
  const r = cv.getBoundingClientRect();
  const cx = Math.max(3, Math.min(GW - 4, Math.floor(((e.clientX - r.left) / r.width) * GW)));
  clickDrop(cx);
});
const VEIL_CD = 30;
$('veil').addEventListener('pointerdown', (e) => e.stopPropagation());
$('veil').addEventListener('click', (e) => {
  e.stopPropagation();
  if (S.veilT > 0) return;
  S.veilT = VEIL_CD;
  queueCoat(MI.ochre);
  note('Прослой охры лёг на поверхность');
});
$('openUp').addEventListener('pointerdown', (e) => e.stopPropagation());

// ---------------- fit ----------------
function fit() {
  const bw = document.body.clientWidth - parseFloat(getComputedStyle(document.body).paddingLeft) - parseFloat(getComputedStyle(document.body).paddingRight);
  const bh = document.body.clientHeight - 16;
  let w = Math.min(bw, (bh * 9) / 16);
  w = Math.max(200, Math.floor(w));
  const g = $('game');
  g.style.width = w + 'px'; g.style.height = Math.round((w * 16) / 9) + 'px';
  g.style.setProperty('--s', (w / 360).toFixed(4));
}
window.addEventListener('resize', fit);

// ---------------- loop ----------------
let last = 0, geoAcc = 0, saveAcc = 0, uiAcc = 0;
function frame(t) {
  const rdt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t; now += rdt;
  const dt = rdt * S.speed;
  // physics: 2 sub-steps a frame (5× speed: more)
  const steps = S.speed > 1 ? 6 : 2;
  for (let k = 0; k < steps; k++) physicsStep();
  // surface tops and the horizon
  let sum = 0;
  for (let x = 0; x < GW; x++) { let y = 0; while (y < BED && !mat[y * GW + x]) y++; tops[x] = y; sum += y; }
  hY += (sum / GW * 2 - hY) * Math.min(1, rdt * 0.8);
  // pressure, every 0.2 s
  geoAcc += dt;
  if (geoAcc >= 0.2) { compact(geoAcc); squeeze(geoAcc); geoAcc = 0; checkEpoch(); }
  // passive energy from the rock above the thing
  const inc = rockCells * 0.01 * dt;
  S.energy += inc; S.earned += inc;
  if (S.veilT > 0) S.veilT = Math.max(0, S.veilT - dt);
  applyCoats(dt);
  // wind
  if (S.lv.wind > 0) { S.windT += dt; if (S.windT >= windEvery(S.lv.wind)) { S.windT = 0; const n = drop(Math.round(pileSize(S.lv.pile) * 0.6)); S.energy += n; S.earned += n; } }
  // volcanoes
  if (featOn('vol') && S.grow.vol > 0.8) {
    S.eruptT -= dt;
    if (Math.random() < dt * 3) { const vx = VOLC[(Math.random() * 2) | 0]; smoke.push({ x: vx + (Math.random() - 0.5) * 3, y: hY - 62 * S.grow.vol, vx: 2 + Math.random() * 3, vy: -4 - Math.random() * 4, t: 3 + Math.random() * 2 }); }
    if (S.eruptT <= 0) {
      S.eruptT = 25 + Math.random() * 20; erupting = 2.5; eruptX = VOLC[(Math.random() * 2) | 0];
      const vx = Math.round(eruptX / 2);
      drop(30 + 4 * S.lv.pile, vx + Math.round((Math.random() - 0.5) * 16), MI.ash);
      queueCoat(MI.tephra, vx - 24, vx + 24);
    }
    if (erupting > 0) {
      erupting -= dt;
      for (let k = 0; k < 3; k++) smoke.push({ x: eruptX, y: hY - 60 * S.grow.vol, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 20, t: 0.8 + Math.random(), hot: Math.random() < 0.4 });
    }
  }
  // what the epochs grow in the background
  for (const f in S.grow) if (featOn(f) && S.grow[f] < 1) S.grow[f] = Math.min(1, S.grow[f] + dt * 0.12);
  render(rdt);
  // ui
  uiAcc += rdt;
  if (dirtyUI || uiAcc > 0.25) { updateHUD(); dirtyUI = false; uiAcc = 0; }
  if (noteT > 0 && (noteT -= rdt) <= 0) $('note').classList.remove('on');
  if (titleT > 0 && (titleT -= rdt) <= 0) $('title').classList.remove('on');
  saveAcc += rdt;
  if (saveAcc > 5) { saveAcc = 0; saveLocal(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveLocal(); });

function start(data) {
  S = newState(); resetWorld();
  let ok = false;
  try { if (data && data.save) ok = deserialize(data.save); } catch (e) { ok = false; }
  if (!ok) { S = newState(); resetWorld(); ok = loadLocal(); }
  if (!ok) { S = newState(); resetWorld(); }
  if (S.clicks >= 3) $('hint').style.opacity = 0;
  skyT = S.epoch;
  fit(); buildList(); updateHUD();
  for (let k = 0; k < 400; k++) physicsStep();
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
}
window.__sand = { get S() { return S; }, drop, clickDrop, mat, MATS, MI, tops, get rockCells() { return rockCells; } };
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ save: serialize() }));
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
</script>
